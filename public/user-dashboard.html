<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold text-gray-800">CMS Customer</h1>
                </div>
                <div class="flex gap-4">
                    <a href="tracking.html" class="text-gray-600 hover:text-blue-600">Track</a>
                    <button id="logoutBtn" class="text-red-600 hover:text-red-700">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid md:grid-cols-3 gap-6">
            <!-- Book a Courier -->
            <section class="md:col-span-2 bg-white rounded-xl shadow-md p-6">
                <h2 class="text-xl font-bold mb-4">Book a Courier</h2>
                <form id="bookForm" class="space-y-4">
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="form-label">Receiver Name</label>
                            <input id="receiver_name" class="form-input" required>
                        </div>
                        <div>
                            <label class="form-label">Receiver Email</label>
                            <input id="receiver_email" type="email" class="form-input">
                        </div>
                        <div>
                            <label class="form-label">Receiver Phone</label>
                            <input id="receiver_phone" class="form-input">
                        </div>
                        <div>
                            <label class="form-label">Delivery Type</label>
                            <select id="delivery_type" class="form-input">
                                <option value="normal">Normal</option>
                                <option value="express">Express</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label">Origin City</label>
                            <input id="origin" class="form-input" required>
                        </div>
                        <div>
                            <label class="form-label">Destination City</label>
                            <input id="destination" class="form-input" required>
                        </div>
                        <div>
                            <label class="form-label">Pickup Address</label>
                            <input id="from_address" class="form-input">
                        </div>
                        <div>
                            <label class="form-label">Delivery Address</label>
                            <input id="to_address" class="form-input">
                        </div>
                        <div>
                            <label class="form-label">Pickup Schedule</label>
                            <input id="pickup_time" type="datetime-local" class="form-input">
                        </div>
                    </div>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="form-label">Weight (kg)</label>
                            <input id="weight" type="number" step="0.1" class="form-input" value="1">
                        </div>
                        <div>
                            <label class="form-label">Description</label>
                            <input id="description" class="form-input">
                        </div>
                    </div>
                    <div class="flex items-center justify-between flex-wrap gap-3">
                        <div>
                            <p id="price" class="text-gray-700">Estimated Cost: --</p>
                            <p id="eta" class="text-gray-600 text-sm">ETA: --</p>
                        </div>
                        <div class="flex gap-2">
                            <button class="btn-secondary" type="button" id="btnQuote">Get Quote</button>
                            <button class="btn-primary" type="submit">Book Now</button>
                        </div>
                    </div>
                </form>
            </section>

            <!-- Booking History -->
            <section class="bg-white rounded-xl shadow-md p-6">
                <h2 class="text-xl font-bold mb-4">Your Shipments</h2>
                <div class="table-container">
                    <table class="min-w-full">
                        <thead>
                            <tr>
                                <th>Tracking</th>
                                <th>Status</th>
                                <th>Cost</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody">
                            <tr><td colspan="3" class="text-center py-6 text-gray-500">No data</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script>
        function getHeaders(){
            return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('userToken')}` };
        }

        function estimate(){
            const weight = Number(document.getElementById('weight').value || 1);
            const type = document.getElementById('delivery_type').value;
            const base = 5; const perKg = 2; const mult = type === 'express' ? 1.5 : 1;
            const cost = ((base + weight * perKg) * mult).toFixed(2);
            document.getElementById('price').textContent = `Estimated Cost: $${cost}`;
        }

        ['weight','delivery_type'].forEach(id => document.getElementById(id).addEventListener('input', estimate));
        estimate();

        // Quote button
        document.getElementById('btnQuote').addEventListener('click', async ()=>{
            const payload = {
                origin: document.getElementById('origin').value,
                destination: document.getElementById('destination').value,
                weight: document.getElementById('weight').value,
                delivery_type: document.getElementById('delivery_type').value
            };
            const resp = await fetch('/api/user/quote', { method:'POST', headers: getHeaders(), body: JSON.stringify(payload) });
            const data = await resp.json();
            if(!resp.ok){ alert(data.error||'Failed to get quote'); return; }
            document.getElementById('price').textContent = `Estimated Cost: $${Number(data.cost).toFixed(2)}`;
            document.getElementById('eta').textContent = `ETA: ${data.eta_minutes} minutes`;
        });

        async function loadHistory(){
            const resp = await fetch('/api/user/shipments', { headers: getHeaders() });
            const items = await resp.json();
            const body = document.getElementById('historyBody');
            if(!Array.isArray(items) || items.length===0){
                body.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-gray-500">No bookings yet</td></tr>';
                return;
            }
            body.innerHTML = items.map(p=>`
                <tr>
                    <td class="font-semibold text-blue-600">${p.tracking_id}</td>
                    <td><span class="status-badge ${p.status==='Delivered'?'status-delivered':p.status==='In Transit'?'status-in-transit':'status-pending'}">${p.status}</span></td>
                    <td>$${(p.cost||0).toFixed? p.cost.toFixed(2): p.cost}</td>
                </tr>
            `).join('');
        }

        document.getElementById('bookForm').addEventListener('submit', async (e)=>{
            e.preventDefault();
            const data = {
                receiver_name: document.getElementById('receiver_name').value,
                receiver_email: document.getElementById('receiver_email').value,
                receiver_phone: document.getElementById('receiver_phone').value,
                origin: document.getElementById('origin').value,
                destination: document.getElementById('destination').value,
                from_address: document.getElementById('from_address').value,
                to_address: document.getElementById('to_address').value,
                pickup_time: document.getElementById('pickup_time').value,
                weight: document.getElementById('weight').value,
                description: document.getElementById('description').value,
                delivery_type: document.getElementById('delivery_type').value
            };
            const resp = await fetch('/api/user/book', { method:'POST', headers: getHeaders(), body: JSON.stringify(data) });
            const out = await resp.json();
            if(!resp.ok){ alert(out.error||'Booking failed'); return; }
            alert(`Booked! Tracking ID: ${out.tracking_id}, Cost: $${out.cost}`);
            loadHistory();
        });

        document.getElementById('logoutBtn').addEventListener('click', ()=>{ localStorage.removeItem('userToken'); window.location.href='user-login.html';});

        // Guard
        if(!localStorage.getItem('userToken')) window.location.href='user-login.html';
        loadHistory();
    </script>
</body>
</html>
